[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openflywheel"
version = "0.1.0"
description = "Company workspace System Book foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "fastapi>=0.111,<1",
    "httpx>=0.27,<1",
    "mcp==2.0.0",
    "uvicorn==0.52.3",
    "anyio>=4.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]

[project.scripts]
ofw = "openflywheel.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/openflywheel", "src/ofw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "e2e_real: end-to-end tests against real external systems",
    "live_github: tests requiring OFW_GITHUB_TOKEN and network",
]
addopts = "-m 'not e2e_real and not live_github'"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/openflywheel/store/repos/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "typings"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_expr = true
disallow_any_unimported = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
